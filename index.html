<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>最上境社區 - 住戶線上共好反映系統</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    [v-cloak] { display: none; }
    input, select, textarea, button { font-size: 16px !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
<div id="app" v-cloak class="min-h-screen flex flex-col justify-between">

  <!-- ================= 頂部導航 ================= -->
  <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-building-circle-check text-2xl text-emerald-300"></i>
        <div>
          <h1 class="text-base font-bold tracking-wider">最上境社區</h1>
          <p class="text-xs text-emerald-200">免安裝住戶反映與管理系統</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button @click="fetchIssues" :disabled="loading" title="重新整理雲端資料" class="text-xs bg-emerald-700 hover:bg-emerald-600 px-2.5 py-1.5 rounded-full transition text-white">
          <i class="fa-solid fa-rotate" :class="{ 'fa-spin': loading }"></i>
        </button>
        <button @click="toggleViewMode" class="text-xs bg-emerald-900 border border-emerald-500 hover:bg-emerald-700 px-3 py-1.5 rounded-full transition text-white">
          <i :class="isAdmin ? 'fa-solid fa-user' : 'fa-solid fa-user-shield'" class="mr-1"></i>
          切換為{{ isAdmin ? '住戶前台' : '管理後台' }}
        </button>
      </div>
    </div>
  </header>

  <!-- ================= 主內容區 ================= -->
  <main class="max-w-4xl mx-auto w-full px-4 py-6 flex-1">

    <div v-if="loading" class="mb-4 text-center text-xs text-slate-500 bg-white py-2 rounded shadow-sm border border-slate-200">
      <i class="fa-solid fa-circle-notch fa-spin mr-1 text-emerald-600"></i>正在與雲端試算表連線中...
    </div>

    <!-- ================= 住戶前台 ================= -->
    <div v-if="!isAdmin">
      <div class="flex border-b border-slate-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
        <button 
          @click="residentTab = 'submit'" 
          :class="residentTab === 'submit' ? 'border-b-2 border-emerald-600 text-emerald-700 font-bold bg-emerald-50' : 'text-slate-600 hover:bg-slate-50'"
          class="flex-1 py-3 text-center transition flex justify-center items-center">
          <i class="fa-solid fa-pen-to-square mr-2"></i>我要反映
        </button>
        <button 
          @click="residentTab = 'track'" 
          :class="residentTab === 'track' ? 'border-b-2 border-emerald-600 text-emerald-700 font-bold bg-emerald-50' : 'text-slate-600 hover:bg-slate-50'"
          class="flex-1 py-3 text-center transition flex justify-center items-center">
          <i class="fa-solid fa-magnifying-glass mr-2"></i>進度查詢
        </button>
      </div>

      <!-- 表單：新增案件 -->
      <div v-if="residentTab === 'submit'" class="bg-white rounded-b-lg rounded-t-none p-6 shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold border-l-4 border-emerald-600 pl-2 mb-4">反映資料填寫</h2>
        <form @submit.prevent="submitIssue" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">棟別 / 樓層戶號 *</label>
              <input v-model="form.unit" required type="text" placeholder="例：A棟 10樓之2" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">聯絡電話 (選填)</label>
              <input v-model="form.phone" type="tel" placeholder="便於管理室快速核對" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">
