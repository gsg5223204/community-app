<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
  <title>最上境社區 - 住戶線上共好反映系統</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    [v-cloak] { display: none; }
    input, select, textarea, button { font-size: 16px !important; }
    video { max-height: 280px; width: 100%; object-fit: contain; background: #000; border-radius: 6px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
<div id="app" v-cloak class="min-h-screen flex flex-col justify-between">

  <!-- 頂部導航 -->
  <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-building-circle-check text-2xl text-emerald-300"></i>
        <div>
          <h1 class="text-base font-bold tracking-wider">最上境社區</h1>
          <p class="text-xs text-emerald-200">免安裝住戶反映與管理系統</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button @click="fetchIssues" :disabled="loading" title="重新整理雲端資料" class="text-xs bg-emerald-700 hover:bg-emerald-600 px-2.5 py-1.5 rounded-full transition text-white">
          <i class="fa-solid fa-rotate" :class="{ 'fa-spin': loading }"></i>
        </button>
        <button v-if="!isAdmin" @click="promptAdminLogin" class="text-xs bg-emerald-900 border border-emerald-500 hover:bg-emerald-700 px-3 py-1.5 rounded-full transition text-white">
          <i class="fa-solid fa-lock mr-1"></i>管理後台
        </button>
        <button v-else @click="adminLogout" class="text-xs bg-red-800 border border-red-500 hover:bg-red-700 px-3 py-1.5 rounded-full transition text-white">
          <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i>退出後台
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-4xl mx-auto w-full px-4 py-6 flex-1">
    <div v-if="loading" class="mb-4 text-center text-xs text-slate-600 bg-emerald-50 border border-emerald-200 py-2 rounded shadow-sm">
      <i class="fa-solid fa-circle-notch fa-spin mr-1 text-emerald-600"></i>正在同步雲端資料庫...
    </div>

    <!-- 住戶前台 -->
    <div v-if="!isAdmin">
      <div class="flex border-b border-slate-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
        <button @click="residentTab = 'submit'" :class="residentTab === 'submit' ? 'border-b-2 border-emerald-600 text-emerald-700 font-bold bg-emerald-50' : 'text-slate-600 hover:bg-slate-50'" class="flex-1 py-3 text-center transition">
          <i class="fa-solid fa-pen-to-square mr-2"></i>我要反映
        </button>
        <button @click="residentTab = 'track'" :class="residentTab === 'track' ? 'border-b-2 border-emerald-600 text-emerald-700 font-bold bg-emerald-50' : 'text-slate-600 hover:bg-slate-50'" class="flex-1 py-3 text-center transition">
          <i class="fa-solid fa-magnifying-glass mr-2"></i>進度查詢
        </button>
      </div>

      <!-- 表單 -->
      <div v-if="residentTab === 'submit'" class="bg-white rounded-b-lg p-6 shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold border-l-4 border-emerald-600 pl-2 mb-4">反映資料填寫</h2>
        <form @submit.prevent="submitIssue" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">棟別 / 樓層戶號 *</label>
              <input v-model="form.unit" required type="text" placeholder="例：A1-10" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">自訂查詢密碼 * (必填)</label>
              <input v-model="form.queryPassword" required type="text" placeholder="查詢案件時核身用" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">反映類別 *</label>
            <select v-model="form.category" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
              <option value="公設修繕">公設硬體修繕</option>
              <option value="環境清潔">環境衛生清潔</option>
              <option value="違規處理">違規處理 (違停/雜物)</option>
              <option value="安寧秩序">安寧秩序 (噪音/寵物)</option>
              <option value="管委會建議">管委會建議</option>
              <option value="其他">其他反映事項</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">詳細說明 *</label>
            <textarea v-model="form.description" required rows="4" placeholder="請描述發生地點、具體狀況或改善建議..." class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-sm font-medium text-slate-700">檢附相片 / 影片 (最多 3 則，點擊圖片可放大)</label>
              <span class="text-xs text-slate-400">已選取 {{ residentFiles.length }} / 3</span>
            </div>
            <input type="file" accept="image/*,video/*" multiple @change="handleResidentFileUpload" :disabled="residentFiles.length >= 3" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 disabled:opacity-50">
            
            <div v-if="residentFiles.length > 0" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-3">
              <div v-for="(item, idx) in residentFiles" :key="idx" class="relative rounded-lg border border-slate-200 bg-slate-900 overflow-hidden flex flex-col justify-center items-center p-1">
                <img v-if="item.type.startsWith('image')" :src="item.data" @click="openImageModal(item.data)" class="w-full h-32 object-cover rounded cursor-pointer hover:opacity-90 transition">
                <video v-else :src="item.data" controls playsinline preload="metadata" class="w-full h-32"></video>
                <button type="button" @click="residentFiles.splice(idx, 1)" class="absolute top-2 right-2 bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow hover:bg-red-700 z-10"><i class="fa-solid fa-xmark"></i></button>
              </div>
            </div>
          </div>

          <button type="submit" :disabled="submitting" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded shadow transition">
            {{ submitting ? '正在送出至雲端...' : '送出反映案件' }}
          </button>
        </form>
      </div>

      <!-- 進度查詢 -->
      <div v-if="residentTab === 'track'" class="space-y-4">
        <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200 space-y-3">
          <div class="font-bold text-sm text-slate-800"><i class="fa-solid fa-user-lock text-emerald-600 mr-2"></i>案件進度雙重核驗查詢</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input v-model="trackKeyword" type="text" placeholder="案件代碼 或 戶號 *" class="w-full border border-slate-300 rounded px-3 py-1.5 text-sm outline-none">
            <input v-model="trackPassword" type="password" placeholder="查詢密碼 *" class="w-full border border-slate-300 rounded px-3 py-1.5 text-sm outline-none">
          </div>
          <div class="flex justify-end">
            <button @click="clearTrackInput" class="text-xs text-slate-500 hover:text-slate-700">清空條件</button>
          </div>
        </div>

        <!-- 補全截斷的內容 -->
        <div v-if="!trackKeyword.trim() || !trackPassword.trim()" class="text-center text-sm text-slate-500 p-8 bg-white rounded-lg border border-slate-200 shadow-sm">
          <i class="fa-solid fa-keyboard text-2xl text-slate-300 mb-2 block"></i>
          請輸入「案件代碼或戶號」與「查詢密碼」進行安全核驗
        </div>
        
        <div v-else class="space-y-4">
          <div v-for="item in filteredIssues" :key="item.id" class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
            <div class="flex justify-between items-start mb-3">
              <div>
                <span class="text-xs font-mono bg-slate-100 px-2 py-1 rounded text-slate-600 mr-2">#{{ item.id.substring(0,8) }}</span>
                <span class="text-sm font-bold text-emerald-800">{{ item.category }}</span>
              </div>
              <span :class="getStatusClass(item.status)" class="text-xs px-2.5 py-1 rounded-full font-semibold">{{ item.status }}</span>
            </div>
            <p class="text-sm text-slate-700 mb-3 whitespace-pre-wrap">{{ item.description }}</p>
            <div class="text-xs text-slate-400 flex justify-between items-center border-t border-slate-100 pt-3">
              <span>反映戶號：{{ item.unit }}</span>
              <span>更新時間：{{ formatDate(item.updated_at) }}</span>
            </div>
          </div>
          <div v-if="filteredIssues.length === 0" class="text-center text-sm text-slate-500 p-8 bg-white rounded-lg border border-slate-200">
            無符合該查驗條件的案件，請確認輸入資訊。
          </div>
        </div>
      </div>
    </div>

    <!-- 管理員後台 -->
    <div v-else class="bg-white rounded-lg p-6 shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold border-l-4 border-red-600 pl-2 mb-4 text-red-800">管理員控制台</h2>
      <div class="overflow-x-auto">
