<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>最上境社區 - 住戶線上共好反映系統</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    [v-cloak] { display: none; }
    input, select, textarea, button { font-size: 16px !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
<div id="app" v-cloak class="min-h-screen flex flex-col justify-between">

  <!-- ================= 頂部導航 ================= -->
  <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-building-circle-check text-2xl text-emerald-300"></i>
        <div>
          <h1 class="text-base font-bold tracking-wider">最上境社區</h1>
          <p class="text-xs text-emerald-200">免安裝住戶反映與管理系統</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button @click="fetchIssues" :disabled="loading" title="重新整理雲端資料" class="text-xs bg-emerald-700 hover:bg-emerald-600 px-2.5 py-1.5 rounded-full transition text-white">
          <i class="fa-solid fa-rotate" :class="{ 'fa-spin': loading }"></i>
        </button>
        <button @click="toggleViewMode" class="text-xs bg-emerald-900 border border-emerald-500 hover:bg-emerald-700 px-3 py-1.5 rounded-full transition text-white">
          <i :class="isAdmin ? 'fa-solid fa-user' : 'fa-solid fa-user-shield'" class="mr-1"></i>
          切換為{{ isAdmin ? '住戶前台' : '管理後台' }}
        </button>
      </div>
    </div>
  </header>

  <!-- ================= 主內容區 ================= -->
  <main class="max-w-4xl mx-auto w-full px-4 py-6 flex-1">

    <!-- 頂端連線狀態條（有在同步才會短暫顯示） -->
    <div v-if="loading" class="mb-4 text-center text-xs text-slate-600 bg-emerald-50 border border-emerald-200 py-2 rounded shadow-sm">
      <i class="fa-solid fa-circle-notch fa-spin mr-1 text-emerald-600"></i>同步雲端試算表資料中...
    </div>

    <!-- ================= 住戶前台 ================= -->
    <div v-if="!isAdmin">
      <div class="flex border-b border-slate-300 mb-6 bg-white rounded-t-lg overflow-hidden shadow-sm">
        <button 
          @click="residentTab = 'submit'" 
          :class="residentTab === 'submit' ? 'border-b-2 border-emerald-600 text-emerald-700 font-bold bg-emerald-50' : 'text-slate-600 hover:bg-slate-50'"
          class="flex-1 py-3 text-center transition flex justify-center items-center">
          <i class="fa-solid fa-pen-to-square mr-2"></i>我要反映
        </button>
        <button 
          @click="residentTab = 'track'" 
          :class="residentTab === 'track' ? 'border-b-2 border-emerald-600 text-emerald-700 font-bold bg-emerald-50' : 'text-slate-600 hover:bg-slate-50'"
          class="flex-1 py-3 text-center transition flex justify-center items-center">
          <i class="fa-solid fa-magnifying-glass mr-2"></i>進度查詢
        </button>
      </div>

      <!-- 表單：新增案件 -->
      <div v-if="residentTab === 'submit'" class="bg-white rounded-b-lg rounded-t-none p-6 shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold border-l-4 border-emerald-600 pl-2 mb-4">反映資料填寫</h2>
        <form @submit.prevent="submitIssue" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">棟別 / 樓層戶號 *</label>
              <input v-model="form.unit" required type="text" placeholder="例：A棟 10樓之2" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-700 mb-1">聯絡電話 (選填)</label>
              <input v-model="form.phone" type="tel" placeholder="便於管理室快速核對" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">反映類別 *</label>
            <select v-model="form.category" required class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
              <option value="公設修繕">公設硬體修繕 (梯廳、電梯、大門)</option>
              <option value="環境清潔">環境衛生與清潔</option>
              <option value="違規處理">違規處理 (違停 / 雜物堆放)</option>
              <option value="安寧秩序">安寧秩序 (噪音干擾 / 寵物相關)</option>
              <option value="管委會建議">管委會建議 (運作與興革意見)</option>
              <option value="其他">其他反映事項</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">詳細說明 *</label>
            <textarea v-model="form.description" required rows="4" placeholder="請描述發生地點、具體狀況或改善建議..." class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
          </div>

          <button type="submit" :disabled="submitting" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded shadow transition flex justify-center items-center">
            <i class="fa-solid fa-paper-plane mr-2" :class="{ 'fa-spin': submitting }"></i>
            {{ submitting ? '正在寫入雲端試算表...' : '送出反映案件' }}
          </button>
        </form>
      </div>

      <!-- 進度查詢頁 -->
      <div v-if="residentTab === 'track'" class="space-y-4">
        <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200 flex space-x-2">
          <input v-model="trackKeyword" type="text" placeholder="輸入戶號 (如 A棟) 或案件代碼" class="flex-1 border border-slate-300 rounded px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          <button @click="trackKeyword = ''" v-if="trackKeyword" class="text-xs text-slate-400 px-2">清空</button>
        </div>

        <div v-if="filteredResidentIssues.length === 0 && !loading" class="text-center py-10 bg-white rounded-lg border border-slate-200 text-slate-400 text-sm">
          目前查無相關反映案件紀錄
        </div>

        <div v-for="issue in filteredResidentIssues" :key="issue.id" class="bg-white rounded-lg p-5 shadow-sm border border-slate-200">
          <div class="flex justify-between items-start mb-2">
            <div>
              <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600 mr-2">{{ issue.id }}</span>
              <span class="text-xs font-semibold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">{{ issue.category }}</span>
              <h3 class="font-bold
