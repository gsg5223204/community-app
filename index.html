<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>最上境社區 - 住戶線上共好反映系統</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    [v-cloak] { display: none; }
    input, select, textarea, button { font-size: 16px !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
<div id="app" v-cloak class="min-h-screen flex flex-col justify-between">

  <!-- ================= 頂部導航 ================= -->
  <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-building-circle-check text-2xl text-emerald-300"></i>
        <div>
          <h1 class="text-base font-bold tracking-wider">最上境社區</h1>
          <p class="text-xs text-emerald-200">免安裝線上反映系統</p>
        </div>
      </div>
      <button v-if="isAdmin" @click="logoutAdmin" class="text-xs bg-red-700/80 hover:bg-red-700 px-3 py-1.5 rounded-full transition">
        <i class="fa-solid fa-right-from-bracket mr-1"></i>登出後台
      </button>
    </div>
  </header>

  <!-- ================= 主內容區 ================= -->
  <main class="max-w-2xl mx-auto w-full px-4 py-5 flex-1">

    <!-- ================= 住戶前台 ================= -->
    <div v-if="!isAdmin" class="space-y-4">
      <div class="flex border-b border-slate-300 mb-5 bg-white rounded-t-xl overflow-hidden shadow-sm">
        <button 
          @click="residentTab = 'submit'" 
          :class="residentTab === 'submit' ? 'border-b-2 border-emerald-600 text-emerald-700 font-bold bg-emerald-50' : 'text-slate-600 hover:bg-slate-50'"
          class="flex-1 py-3 text-center transition flex justify-center items-center text-sm">
          <i class="fa-solid fa-pen-to-square mr-2"></i>我要反映
        </button>
        <button 
          @click="residentTab = 'track'" 
          :class="residentTab === 'track' ? 'border-b-2 border-emerald-600 text-emerald-700 font-bold bg-emerald-50' : 'text-slate-600 hover:bg-slate-50'"
          class="flex-1 py-3 text-center transition flex justify-center items-center text-sm">
          <i class="fa-solid fa-magnifying-glass mr-2"></i>進度查詢
        </button>
      </div>

      <!-- 表單：住戶填寫 -->
      <div v-if="residentTab === 'submit'" class="bg-white rounded-b-xl rounded-t-none p-5 shadow-sm border border-slate-200">
        <div class="mb-4 bg-emerald-50 border border-emerald-200 p-3 rounded-lg text-xs text-emerald-800 flex items-center">
          <i class="fa-solid fa-circle-info text-emerald-600 mr-2 text-base"></i>
          <span>住戶免下載 App，送出後可隨時憑「案件編號」或「戶號」在線上查詢處理進度。</span>
        </div>

        <form @submit.prevent="submitIssue" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">棟別 / 戶號 <span class="text-red-500">*</span></label>
              <input v-model="form.unit" required type="text" placeholder="例：A棟 8樓之1" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">聯絡手機 (選填)</label>
              <input v-model="form.phone" type="tel" placeholder="便於管理室緊急聯繫" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">反映類別 <span class="text-red-500">*</span></label>
            <select v-model="form.category" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
              <option value="公設修繕">公設硬體修繕 (梯廳、電梯、大門、照明)</option>
              <option value="環境清潔">環境衛生與垃圾清潔</option>
              <option value="違規處理">違規停車 / 樓梯間雜物堆置</option>
              <option value="安寧秩序">噪音干擾 / 寵物相關管理</option>
              <option value="管委會建議">管委會運作與興革意見</option>
              <option value="其他">其他緊急通報</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">詳細說明 <span class="text-red-500">*</span></label>
            <textarea v-model="form.description" required rows="3" placeholder="請描述發生地點、具體情況或建議改善方式..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
          </div>

          <!-- 前台上傳：相片／短影片 -->
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">上傳佐證相片／短影片 (選填)</label>
            <input type="file" accept="image/*,video/*" @change="handleFileUpload" class="w-full text-xs text-slate-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
            <p class="text-[10px] text-slate-400 mt-0.5">可直接拍照、手機錄影或從相簿上傳（影片建議 10MB 內）。</p>
            
            <div v-if="form.mediaPreview" class="mt-2.5">
              <template v-if="form.mediaType === 'image'">
                <img :src="form.mediaPreview" alt="預覽相片" class="max-h-48 rounded-lg border border-slate-200">
              </template>
              <template v-else-if="form.mediaType === 'video'">
                <video :src="form.mediaPreview" controls class="max-h-48 w-full rounded-lg border border-slate-200 bg-black"></video>
              </template>
              <button type="button" @click="removeResidentMedia" class="text-xs text-red-500 hover:underline mt-1 block">
                <i class="fa-solid fa-trash mr-1"></i>移除已選檔案
              </button>
            </div>
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg shadow-md transition active:scale-98 flex justify-center items-center">
            <i class="fa-solid fa-paper-plane mr-2"></i>送出反映案件
          </button>
        </form>
      </div>

      <!-- 進度查詢頁 -->
      <div v-if="residentTab === 'track'" class="space-y-4">
        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 flex space-x-2">
          <input v-model="trackKeyword" type="text" placeholder="輸入戶號 (如 A棟) 或案件代碼" class="flex-1 border border-slate-300 rounded-md px-3 py-1.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          <button @click="trackKeyword = ''" v-if="trackKeyword" class="text-xs text-slate-400 px-1">清空</button>
        </div>

        <div v-if="filteredResidentIssues.length === 0" class="text-center py-12 text-slate-400 text-sm bg-white rounded-xl border border-slate-200">
          目前尚無符合的反映紀錄
        </div>

        <div v-for="issue in filteredResidentIssues" :key="issue.id" class="bg-white rounded-xl p-4 shadow-sm border border-slate-200">
          <div class="flex justify-between items-start mb-2">
            <div>
              <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600 mr-1.5">{{ issue.id }}</span>
              <span class="text-xs font-semibold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">{{ issue.category }}</span>
              <h3 class="font-bold text-sm mt-1 text-slate-800">{{ issue.unit }}</h3>
            </div>
            <span :class="getStatusBadgeClass(issue.status)" class="text-xs font-bold px-2.5 py-0.5 rounded-full">
              {{ issue.status }}
            </span>
          </div>

          <p class="text-xs text-slate-600 mb-2 bg-slate-50 p-2.5 rounded border border-slate-100">{{ issue.description }}</p>
          
          <div v-if="issue.media" class="mb-2">
            <template v-if="issue.media.type === 'image'">
              <img :src="issue.media.data" class="max-h-40 rounded border border-slate-200">
            </template>
            <template v-else-if="issue.media.type === 'video'">
              <video :src="issue.media.data" controls class="max-h-44 w-full rounded border border-slate-200 bg-black"></video>
            </template>
          </div>

          <div class="text-[11px] text-slate-400 mb-2">通報時間：{{ issue.createdAt }}</div>

          <div class="border-t border-slate-200 pt-2.5">
            <div class="text-xs font-bold text-slate-700 flex items-center mb-1">
              <i class="fa-solid fa-clipboard-check text-emerald-600 mr-1.5"></i>管委會／物業管理處置進度：
            </div>
            <div v-if="issue.finalReply || issue.replyAttachment" class="text-xs bg-emerald-50/70 border border-emerald-100 text-slate-700 p-2.5 rounded-lg space-y-2">
              <div v-if="issue.finalReply">{{ issue.finalReply }}</div>
              
              <div v-if="issue.replyAttachment" class="mt-2 pt-2 border-t border-emerald-200/60">
                <span class="text-[11px] font-bold text-emerald-800 block mb-1">
                  <i class="fa-solid fa-paperclip mr-1"></i>處置佐證附件：
                </span>
                
                <div v-if="issue.replyAttachment.type === 'image'">
                  <img :src="issue.replyAttachment.data" class="max-h-48 rounded border border-emerald-200 shadow-sm">
                </div>
                
                <div v-else-if="issue.replyAttachment.type === 'video'">
